name: Build release package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: |
          for environment in dev test prod; do
            python scripts/package_rules.py --environment "$environment" --output "dist/$environment"
          done
          tar -czf sentinel-detection-as-code-${{ github.ref_name }}.tar.gz dist
      - uses: softprops/action-gh-release@v2
        with:
          files: sentinel-detection-as-code-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
