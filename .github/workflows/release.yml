name: Build release package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: |
          for environment in dev test prod; do
            python scripts/package_rules.py --environment "$environment" --output "dist/$environment"
          done
          tar -czf sentinel-detection-as-code-${{ github.ref_name }}.tar.gz dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: sentinel-detection-as-code-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
