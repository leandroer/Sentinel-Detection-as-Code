name: Validate detection content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_telemetry.py --all --output build/telemetry
      - run: python scripts/package_rules.py --environment dev --output dist/dev
      - name: Validate generated JSON
        run: |
          python -m json.tool dist/dev/sentinel-analytics-rules.json >/dev/null
          python -m json.tool dist/dev/manifest.json >/dev/null
      - name: Build Bicep
        run: az bicep build --file infra/main.bicep
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dev-sentinel-package
          path: dist/dev/
          if-no-files-found: error
