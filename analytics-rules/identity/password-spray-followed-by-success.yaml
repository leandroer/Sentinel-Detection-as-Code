id: 4cfe7214-c7de-4ca5-a170-058ea57e18f1
name: Password spray followed by successful sign-in
description: Correlates distributed authentication failures with a later successful sign-in for a targeted account.
status: Available
severity: High
kind: Scheduled
enabled: true
queryFrequency: PT5M
queryPeriod: PT30M
triggerOperator: GreaterThan
triggerThreshold: 0
tactics: [CredentialAccess, InitialAccess]
techniques: [T1110, T1078]
subTechniques: [T1110.003]
dataSources: [SigninLogs]
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserPrincipalName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SuccessfulIPAddress
customDetails:
  FailedIPAddressCount: FailedIPAddressCount
  FailureCount: FailureCount
query: |
  let threshold = 8;
  let failures = SigninLogs
  | where TimeGenerated > ago(30m)
  | where ResultType != 0
  | summarize FailureCount=count(), FailedIPAddressCount=dcount(IPAddress), FailureStart=min(TimeGenerated), FailureEnd=max(TimeGenerated) by UserPrincipalName
  | where FailureCount >= threshold and FailedIPAddressCount >= 3;
  let successes = SigninLogs
  | where TimeGenerated > ago(15m)
  | where ResultType == 0
  | project UserPrincipalName, SuccessTime=TimeGenerated, SuccessfulIPAddress=IPAddress, AppDisplayName;
  failures
  | join kind=inner successes on UserPrincipalName
  | where SuccessTime between (FailureStart .. FailureEnd + 15m)
  | project SuccessTime, UserPrincipalName, SuccessfulIPAddress, AppDisplayName, FailureCount, FailedIPAddressCount, FailureStart, FailureEnd
suppressionDuration: PT1H
suppressionEnabled: false
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT1H
    matchingMethod: Selected
    groupByEntities: [Account]
tuning:
  - Exclude approved penetration-test accounts and trusted identity-provider addresses.
  - Baseline service accounts separately because automated authentication may create high failure counts.
scenario: password-spray-success
