id: 8cb58662-f939-4a14-98e4-48f4881bc28f
name: Endpoint credential dumping indicators
description: Detects command lines associated with LSASS memory dumping and credential extraction.
status: Available
severity: High
kind: Scheduled
enabled: true
queryFrequency: PT5M
queryPeriod: PT15M
triggerOperator: GreaterThan
triggerThreshold: 0
tactics: [CredentialAccess]
techniques: [T1003]
subTechniques: [T1003.001]
dataSources: [DeviceProcessEvents]
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountUpn
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: ProcessCommandLine
customDetails:
  InitiatingProcess: InitiatingProcessFileName
  DetectionReason: DetectionReason
query: |
  DeviceProcessEvents
  | where TimeGenerated > ago(15m)
  | extend CommandLine=tolower(ProcessCommandLine)
  | extend DetectionReason=case(
      FileName =~ "procdump.exe" and CommandLine has "lsass", "ProcDump targeting LSASS",
      FileName =~ "rundll32.exe" and CommandLine has_all ("comsvcs.dll", "minidump"), "Comsvcs MiniDump targeting process",
      CommandLine has_any ("sekurlsa::logonpasswords", "lsadump::sam"), "Credential extraction command",
      "")
  | where isnotempty(DetectionReason)
  | project TimeGenerated, DeviceName, AccountUpn, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessAccountUpn, SHA256, DetectionReason
suppressionDuration: PT1H
suppressionEnabled: false
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT1H
    matchingMethod: Selected
    groupByEntities: [Host]
tuning:
  - Exclude signed administrative tools only when their path, signer, parent process, and change window are constrained.
  - Retain visibility into security-tool testing through a separate informational rule.
scenario: endpoint-credential-dumping
